name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint awesome list
        run: npx --yes awesome-lint
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 is tolerated because some publishers (e.g. amnesty.org) block
          # automated clients while serving the page normally to browsers.
          args: --verbose --no-progress --accept 200,403,429 README.md CONTRIBUTING.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
